<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        body{
            background-color: #ffffff;
            margin-top:100px;
        }
        h1{
            color: #78bcec;
        }
        .form{
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            

            text-align: center;
        }
        #lab2{
           padding-left: 24px;
            
        }
        
        button{
            background-color: #78bcec;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .error{
        color: red;
        font-size: 0.85rem;
        margin-top: 2px;
        display: block;
        }
        input.invalid {
        border: 1px solid red;
        }
        input.valid {
        border: 1px solid green;
        }

    </style>
</head>
<body>
    
    <form class="form"  novalidate>
        <h1>Form Validation</h1>
         <label for="username">Username:</label>
    <input type="text" id="username" name="username" placeholder="Your name" required>
    <p class="error" id="username-error"></p>
    <br>
    <br>

    <label id="lab2" for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="example@ex.com" required>
    <p class="error" id="email-error"></p>
    <br>
    <br>

    <label  for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="**12**" required>
    <p class="error" id="passerror"></p>
    <br>
    <br>

    <button   type="submit">Register</button>
    </form>

    <script>
        let form=document.querySelector('.form');
        form.addEventListener('submit',(e)=>{
            e.preventDefault();

            let isValidInput=true;
            let username=document.getElementById('username').value;
            let u=document.getElementById('username-error');
            
    
            if(username.length<3){
                u.style.display='block';
                u.innerHTML="Too short Name";
                username.classList.add('invalid');
                isValidInput=false;
            }else{
                u.innerHTML="";
                u.style.display='none';
                username.classList.remove('invalid');
            }
         let emailInput = document.getElementById('email').value;       // The element
            let emailValue = emailInput.value;                       // The text string
            let em = document.getElementById('email-error');
          
            // Use || (OR) instead of && so it flags if either is missing
            if (emailValue.includes('@') === false || emailValue.includes('.') === false) {
                em.style.display = 'block';
                em.innerHTML = "Invalid Email";
                emailInput.classList.add('invalid');
                emailInput.classList.remove('valid');
                isValidInput = false;
            } else {
                em.innerHTML = "";
                em.style.display = 'none';
                emailInput.classList.remove('invalid');
                emailInput.classList.add('valid');
            }

        //     isValidInput=false;

        //     password.classList.remove('invalid');
        //   } 

        //   if(isValidInput){
        //     alert("Form submitted successfully!");
        //     form.reset();

        })
    </script>

   
</body>
</html>
